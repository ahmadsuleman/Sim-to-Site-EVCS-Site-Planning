# Distribution-aware final EVCS placement configuration
# Use this file with final_placement_v2.py

seed: 42

final_placement:
  # Number of final EVCS sites to select.
  k: 10


  # Use all ranked candidates available for the selected method and shortlist size.
  # Recommended for final map inference because top-20 can be spatially clustered.
  candidate_pool: all

  # Preferred ranking method order. The script uses the first available method for each city.
  preferred_methods:
    - M5_synthetic_to_hybrid_topM_milp
    - M4_hybrid_ranker_topM_milp
    - M1_kpi_topM_milp

  # Prefer larger shortlist exports because they provide wider geographic choice.
  preferred_shortlist_sizes: [60, 40, 20]

  # Final inference score.
  # Ranking remains important, but local demand and spatial feasibility are also used.
  weights:
    rank_score: 0.45
    local_demand_score: 0.25
    suitability_score: 0.15
    cost_efficiency: 0.10
    underserved_or_equity: 0.05

  # City-zone grid used for distribution-aware placement.
  grid_rows: 5
  grid_cols: 5

  # For K=10, 0.70 means target at least 7 active zones when feasible.
  min_active_zones_fraction_of_k: 0.70

  # Strong spread control. The algorithm relaxes only if infeasible.
  max_per_zone: 1

  # Minimum pairwise distance between final sites.
  # The script relaxes through the list below only if needed to select K sites.
  min_separation_km: 5.0
  min_separation_relaxation: [1.50, 1.25, 1.00, 0.75, 0.50, 0.25]
  # Ranking exports may not include lat/lon, so merge coordinates from candidate_sites*.csv.
  merge_coordinates_from_candidate_sites: true

  # Local demand kernel radius for final ranking score.
  local_demand_radius_km: 10.0

  plots:
    dpi: 300
    figure_format: [png, pdf]
    show_top_ranked_candidates: 40

    # Draw the road graph from graph_nodes*.csv and graph_edges*.csv.
    draw_road_graph: true
    max_edges_on_map: 15000
    road_alpha: 0.25
    road_linewidth: 0.35

    # Optional OSM basemap. Requires: pip install contextily xyzservices
    # If unavailable or offline, the script falls back to the simulator road graph.
    use_basemap: true
    basemap_provider: OpenStreetMap.Mapnik

    # Map padding around candidate/demand extent.
    map_padding_fraction: 0.04